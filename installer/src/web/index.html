<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>AI in One installer</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<!--
  THESIS: Trust. An admin sets up AI in One in their own tenant while someone watches.
    Every question says what it is for, nothing is created before the plan has been reviewed,
    and the run ends as a record they can keep.
  DESIGN: Fluent 2 tokens, Segoe UI Variable, a 248px rail with nested stages, a 48px accent
    tile and a 28px title. Status colours mark outcomes only.
  STORY: Home (record or Set up) -> Sign in -> one question at a time -> the plan: what it
    creates, the access it grants, where it runs and bills -> Go ahead -> steps with timers ->
    Done, with links and a record to save.
  FIRST VIEWPORT: the installation's state and the one action that matters next.
  FORM: a stepper rail with a question card.
-->
<div class="shell">
  <nav id="rail" class="rail" aria-label="Installer"></nav>
  <main id="main">
    <div id="link" class="link" role="status" hidden></div>
    <div id="view"></div>
  </main>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p class="noscript">The installer needs JavaScript. Or run it in the terminal without --ui.</p></noscript>
</body>
</html>
